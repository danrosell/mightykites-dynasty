name: Validate lineup analysis
on:
  push:
    paths:
      - "src/analysis/**"
      - "tests/**"
      - "scripts/**"
      - "netlify/functions/**"
      - ".github/workflows/test-lineup.yml"
  pull_request:
    paths:
      - "src/analysis/**"
      - "tests/**"
      - "scripts/**"
      - "netlify/functions/**"
      - ".github/workflows/test-lineup.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check netlify/functions/league.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Live nflverse refresh integration test (no cache publication)
        run: python3 scripts/refresh-nflverse.py
        env:
          NFL_SEASON: "2026"
      - name: Audit QB Controversy functions against live Sleeper and nflverse source rows
        run: node scripts/validate-qb-live.mjs

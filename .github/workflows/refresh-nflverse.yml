name: Refresh nflverse historical stats
on:
  workflow_dispatch:
  schedule:
    - cron: "40 10 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-nflverse
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate nflverse player stats
        run: python scripts/refresh-nflverse.py
        env:
          NFL_SEASON: "2026"
      - name: Commit validated cache only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical-weekly.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh validated nflverse weekly statistics"
            git push
          fi
